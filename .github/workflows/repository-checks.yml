name: Repository checks

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check version metadata
        run: python scripts/check-version.py

      - name: Validate JSON files
        run: |
          python -m json.tool package.json >/dev/null
          python -m json.tool src-tauri/tauri.conf.json >/dev/null
          python -m json.tool src-tauri/capabilities/default.json >/dev/null

  rust-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
