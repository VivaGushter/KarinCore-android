name: Android build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "scripts/fetch-libv2ray.sh"
      - "VERSION"
      - "CHANGELOG.md"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-debug:
    name: Android arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Xray Android library
        run: npm run android:core

      - name: Validate version metadata
        run: npm run version:check

      - name: Initialize Tauri Android project
        run: npm run tauri -- android init --ci --skip-targets-install

      - name: Build arm64 debug APK
        run: npm run tauri -- android build --apk --target aarch64 --debug --ci

      - name: List APK outputs
        if: always()
        shell: bash
        run: |
          find src-tauri/gen/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KarinCore-Android-${{ github.sha }}-arm64-debug
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: success() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          APK="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          RELEASE_APK="KarinCore-Android-v${VERSION}-arm64-debug.apk"
          cp "$APK" "$RELEASE_APK"

          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { active=1; next }
            active && /^## \[/ { exit }
            active { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            printf 'KarinCore Android v%s\n' "$VERSION" > release-notes.md
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber
          else
            EXTRA_ARGS=()
            if [[ "$VERSION" == *-* ]]; then
              EXTRA_ARGS+=(--prerelease)
            fi

            gh release create "$TAG" "$RELEASE_APK" \
              --target "$GITHUB_SHA" \
              --title "KarinCore Android v${VERSION}" \
              --notes-file release-notes.md \
              "${EXTRA_ARGS[@]}"
          fi
