name: Android build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "scripts/fetch-libv2ray.sh"
      - "VERSION"
      - "CHANGELOG.md"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-debug:
    name: Android arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          for attempt in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Android SDK/NDK installation failed after 3 attempts"
              exit 1
            fi

            echo "SDK/NDK install failed on attempt $attempt, clearing partial download and retrying..."
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973" "$ANDROID_HOME/.temp" 2>/dev/null || true
            sleep 5
          done

          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Xray Android library
        run: npm run android:core

      - name: Validate version metadata
        run: npm run version:check

      - name: Initialize Tauri Android project
        run: npm run tauri -- android init --ci --skip-targets-install

      - name: Build arm64 debug APK
        run: npm run tauri -- android build --apk --target aarch64 --debug --ci

      - name: Verify Xray geodata assets
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/geoip.dat'
          unzip -Z1 "$APK" | grep -Fx 'assets/geosite.dat'

      - name: List APK outputs
        if: always()
        shell: bash
        run: |
          find src-tauri/gen/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KarinCore-Android-${{ github.sha }}-arm64-debug
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub prerelease
    needs: arm64-debug
    # Debug-signed APKs are test artifacts. Publishing requires either the
    # repository opt-in or an explicit marker in the release commit itself.
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:') && (vars.ALLOW_DEBUG_PRERELEASE == 'true' || contains(github.event.head_commit.message, '[publish-debug]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download verified build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: KarinCore-Android-${{ github.sha }}-arm64-debug
          path: release-artifact

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          APK="$(find release-artifact -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          RELEASE_APK="KarinCore-Android-v${VERSION}-arm64-debug.apk"
          cp "$APK" "$RELEASE_APK"

          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { active=1; next }
            active && /^## \[/ { exit }
            active { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            printf 'KarinCore Android v%s\n' "$VERSION" > release-notes.md
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber
          else
            EXTRA_ARGS=()
            if [[ "$VERSION" == *-* ]]; then
              EXTRA_ARGS+=(--prerelease)
            fi

            gh release create "$TAG" "$RELEASE_APK" \
              --target "$GITHUB_SHA" \
              --title "KarinCore Android v${VERSION}" \
              --notes-file release-notes.md \
              "${EXTRA_ARGS[@]}"
          fi
